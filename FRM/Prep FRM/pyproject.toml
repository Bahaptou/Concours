[project]
name = "prep-frm"
version = "0.1.0"
description = "Site local de préparation au FRM Part I : serveur local, éditeur de fiches Typst, simulations Python."
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "typst>=0.15.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
